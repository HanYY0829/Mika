name: Sync upstream Mika

on:
  schedule:
    # Monday 03:00 Asia/Shanghai (Sunday 19:00 UTC)
    - cron: '0 19 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/wangzan101/Mika.git
          git fetch upstream main

      - name: Merge upstream without overwriting local changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/main
          git push origin HEAD:main
