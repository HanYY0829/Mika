name: Sync upstream Mika

on:
  schedule:
    # Daily 03:00 Asia/Shanghai (19:00 UTC previous day)
    - cron: '0 19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-upstream.yml'

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Optional: only runs after the owner installs a scoped GitHub App and
      # configures the MIKA_SYNC_APP_ID variable and MIKA_SYNC_APP_PRIVATE_KEY secret.
      - name: Create scoped GitHub App token (if configured)
        id: app_token
        if: ${{ vars.MIKA_SYNC_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.MIKA_SYNC_APP_ID }}
          private-key: ${{ secrets.MIKA_SYNC_APP_PRIVATE_KEY }}
          repositories: Mika
          permission-contents: write
          permission-workflows: write

      - name: Checkout fork main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          # The default GITHUB_TOKEN cannot update workflow files.
          # A scoped App token is preferred; a correctly scoped PAT is a fallback.
          token: ${{ steps.app_token.outputs.token || secrets.MIKA_SYNC_WORKFLOWS_TOKEN || github.token }}

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/wangzan101/Mika.git
          git fetch upstream main

      - name: Sync upstream and protect local changes
        shell: bash
        env:
          FULL_ACCESS: ${{ steps.app_token.outputs.token != '' || secrets.MIKA_SYNC_WORKFLOWS_TOKEN != '' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          state_file=".github/upstream-sync-state"
          review_file=".github/UPSTREAM_WORKFLOWS_PENDING.md"
          upstream_sha="$(git rev-parse upstream/main)"

          if [[ "$FULL_ACCESS" == "true" ]]; then
            # Full history-preserving merge, only with explicit workflow write access.
            # A real conflict stops the job without pushing or losing fork changes.
            git merge --no-edit upstream/main
            printf '%s\n' "$upstream_sha" > "$state_file"
            git add "$state_file"
            if [[ -f "$review_file" ]] &&
               grep -q 'Automatically generated by Sync upstream Mika' "$review_file"; then
              git rm -f "$review_file"
            fi
          else
            # Safe automatic mode using the default GITHUB_TOKEN. Sync source
            # and docs but never attempt a forbidden .github/workflows push.
            if [[ -f "$state_file" ]]; then
              base_sha="$(cat "$state_file")"
            else
              base_sha="$(git merge-base HEAD upstream/main)"
            fi

            if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid upstream sync baseline: $base_sha" >&2
              exit 1
            fi
            git cat-file -e "$base_sha^{commit}"
            if ! git merge-base --is-ancestor "$base_sha" "$upstream_sha"; then
              echo "Upstream history was rewritten; refusing unsafe sync." >&2
              exit 1
            fi

            patch="$RUNNER_TEMP/mika-upstream.patch"
            git diff --binary --full-index "$base_sha" "$upstream_sha" \
              -- . ':(exclude).github/workflows/**' > "$patch"
            if [[ -s "$patch" ]]; then
              git apply --3way --index "$patch"
            fi

            # Do not silently ignore upstream workflow updates: write a
            # permanent, deduplicated review report in the fork.
            pending="$(mktemp)"
            while IFS= read -r workflow_path; do
              upstream_blob="$(git rev-parse "upstream/main:$workflow_path")"
              fork_blob="missing"
              if git cat-file -e "HEAD:$workflow_path" 2>/dev/null; then
                fork_blob="$(git rev-parse "HEAD:$workflow_path")"
              fi
              if [[ "$fork_blob" != "$upstream_blob" ]]; then
                printf -- '- %s (upstream blob: %s, fork blob: %s)\n' \
                  "$workflow_path" "$upstream_blob" "$fork_blob" >> "$pending"
              fi
            done < <(git ls-tree -r --name-only upstream/main -- .github/workflows/)

            if [[ -s "$pending" ]]; then
              {
                echo '# Mika upstream workflows pending review'
                echo
                echo '<!-- Automatically generated by Sync upstream Mika -->'
                echo 'Upstream workflow files below are not automatically applied without a specially authorized token.'
                echo 'Ordinary source files continue to sync. Review these workflows before enabling them.'
                echo
                cat "$pending"
              } > "$review_file"
              git add "$review_file"
              echo "::warning title=Upstream workflows pending review::See .github/UPSTREAM_WORKFLOWS_PENDING.md; source code sync remains active."
              cat "$review_file" >> "$GITHUB_STEP_SUMMARY"
            elif [[ -f "$review_file" ]] &&
                 grep -q 'Automatically generated by Sync upstream Mika' "$review_file"; then
              git rm -f "$review_file"
            fi
            printf '%s\n' "$upstream_sha" > "$state_file"
            git add "$state_file"
          fi

          if git diff --cached --quiet; then
            echo "Already up to date (in selected sync mode)."
            exit 0
          fi

          git diff --cached --check
          git commit -m "Sync upstream Mika to $(git rev-parse --short=12 upstream/main)"
          git push origin HEAD:main
